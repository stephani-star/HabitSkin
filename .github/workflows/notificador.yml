name: Notificador de Medicamentos HabitSkin

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar revisión de alarmas
        env:
          SUPABASE_URL: 'https://yrqxopmgwwzrgzwcdusy.supabase.co'
          SUPABASE_KEY: 'sb_publishable_kAdWCJcRLBWtS1d2tyzi3Q_dg--5zK4' # Tu llave completa de Supabase
          TELEGRAM_TOKEN: '8979727245:AAGks6dgCdNm9wZ7oM3Z8VOp60FIYB6eTAc'
          TELEGRAM_CHAT_ID: '1879289573'
        run: |
          node -e "
          const https = require('https');

          const ahora = new Date();
          const opciones = { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', hour12: false };
          const horaActual = new Intl.DateTimeFormat('es-MX', opciones).format(ahora).trim();

          console.log('--- REVISIÓN DE ALARMAS ---');
          console.log('Hora local actual (HH:MM):', \`'\${horaActual}'\`);

          const url = \`\${process.env.SUPABASE_URL}/rest/v1/medicamentos?momento=eq.especifica\`;
          
          const req = https.request(url, {
            headers: {
              'apikey': process.env.SUPABASE_KEY,
              'Authorization': \`Bearer \${process.env.SUPABASE_KEY}\`
            }
          }, (res) => {
            let body = '';
            res.on('data', chunk => body += chunk);
            res.on('end', () => {
              try {
                const items = JSON.parse(body);
                if (Array.isArray(items)) {
                  console.log('Total de registros encontrados:', items.length);

                  const coincidentes = items.filter(item => {
                    if (!item.hora) return false;
                    const horaGuardada = String(item.hora).trim();
                    console.log(\`Evaluando: \${item.nombre} -> hora guardada: '\${horaGuardada}'\`);
                    // Compara si la hora guardada empieza con la hora actual (ej. 16:40 vs 16:40:00)
                    return horaGuardada.startsWith(horaActual);
                  });
                  
                  console.log('Alarmas encontradas para este minuto:', coincidentes.length);

                  coincidentes.forEach(item => {
                    const emoji = item.tipo === 'skincare' ? '🧴' : '💊';
                    const mensaje = \`⏰ *¡HORA DE TU MEDICAMENTO!*\n\n\${emoji} *\${item.nombre}*\n📌 *Dosis:* \${item.dosis || 'Tomar según indicación'}\n🕒 *Hora:* \${item.hora}\`;
                    
                    const telegramUrl = \`https://api.telegram.org/bot\${process.env.TELEGRAM_TOKEN}/sendMessage\`;
                    const postData = JSON.stringify({
                      chat_id: process.env.TELEGRAM_CHAT_ID,
                      text: mensaje,
                      parse_mode: 'Markdown'
                    });

                    const tReq = https.request(telegramUrl, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'Content-Length': Buffer.byteLength(postData)
                      }
                    });
                    tReq.write(postData);
                    tReq.end();
                    console.log(\`✅ Notificación enviada para: \${item.nombre}\`);
                  });
                }
              } catch (e) {
                console.error('Error parseando respuesta:', e);
              }
            });
          });
          req.end();
          "
