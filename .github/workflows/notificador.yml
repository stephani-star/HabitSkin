          SUPABASE_URL: 'https://yrqxopmgwwzrgzwcdusy.supabase.co'
          SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlycXhvcG1nd3d6cmd6d2NkdXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyODU2MzIsImV4cCI6MjEwNjg2MTYzMn0.ogv_ZIr8STqkMJZhRlQ8XtuXL76IFdnU9t3evJKj78w' # Tu llave completa de Supabase
          TELEGRAM_TOKEN: '8979727245:AAGks6dgCdNm9wz7oM3Z8vOp6OFIYB6eTAc' # Tu token funcional de Telegram
          TELEGRAM_CHAT_ID: '1879289573'
        run: |
          node -e "
          const https = require('https');

          const ahora = new Date();
          
          // Genera la hora actual y los últimos 3 minutos como margen de tolerancia
          const obtenerHoraHHMM = (fecha) => {
            const op = { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', hour12: false };
            return new Intl.DateTimeFormat('es-MX', op).format(fecha).trim();
          };

          const horasValidas = [];
          for (let i = 0; i < 3; i++) {
            const f = new Date(ahora.getTime() - i * 60000);
            horasValidas.push(obtenerHoraHHMM(f));
          }

          console.log('--- REVISIÓN DE ALARMAS HABITSKIN ---');
          console.log('Hora actual y margen de revisión (HH:MM):', horasValidas);

          const url = \`\${process.env.SUPABASE_URL}/rest/v1/medicamentos?momento=eq.especifica\`;
          
          const req = https.request(url, {
            headers: {
              'apikey': process.env.SUPABASE_KEY,
              'Authorization': \`Bearer \${process.env.SUPABASE_KEY}\`
            }
          }, (res) => {
            let body = '';
            res.on('data', chunk => body += chunk);
            res.on('end', () => {
              try {
                const items = JSON.parse(body);
                if (Array.isArray(items)) {
                  const coincidentes = items.filter(item => {
                    if (!item.hora) return false;
                    const horaGuardada = String(item.hora).trim().substring(0, 5);
                    return horasValidas.includes(horaGuardada);
                  });
                  
                  console.log(\`Se encontraron \${coincidentes.length} alarma(s) para enviar.\`);

                  coincidentes.forEach(item => {
                    const emoji = item.tipo === 'skincare' ? '🧴' : '💊';
