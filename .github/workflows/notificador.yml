name: Notificador de Medicamentos HabitSkin

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar revisión de alarmas
        env:
          SUPABASE_URL: 'https://yrqxopmgwwzrgzwcdusy.supabase.co'
          SUPABASE_KEY: 'sb_publishable_kAdWCJcRLBWtS1d2tyzi3Q_dg--5zK4' # Pega aquí tu llave completa
          TELEGRAM_TOKEN: '8979727245:AAGks6dgCdNm9wZ7oM3Z8VOp60FIYB6eTAc'
          TELEGRAM_CHAT_ID: '1879289573'
        run: |
          node -e "
          const https = require('https');

          console.log('--- PRUEBA DIRECTA DE TELEGRAM ---');

          const url = \`\${process.env.SUPABASE_URL}/rest/v1/medicamentos?limit=1\`;
          
          const req = https.request(url, {
            headers: {
              'apikey': process.env.SUPABASE_KEY,
              'Authorization': \`Bearer \${process.env.SUPABASE_KEY}\`
            }
          }, (res) => {
            let body = '';
            res.on('data', chunk => body += chunk);
            res.on('end', () => {
              try {
                const items = JSON.parse(body);
                if (Array.isArray(items) && items.length > 0) {
                  const item = items[0];
                  const emoji = item.tipo === 'skincare' ? '🧴' : '💊';
                  const mensaje = \`🚨 *PRUEBA DE CONEXIÓN EXITOSA*\n\n\${emoji} *\${item.nombre}*\n📌 *Dosis:* \${item.dosis || 'Tomar según indicación'}\n🕒 *Hora registrada:* \${item.hora || 'Sin hora'}\n\n¡Tu bot de Telegram está funcionando perfectamente!\`;
                  
                  const telegramUrl = \`https://api.telegram.org/bot\${process.env.TELEGRAM_TOKEN}/sendMessage\`;
                  const postData = JSON.stringify({
                    chat_id: process.env.TELEGRAM_CHAT_ID,
                    text: mensaje,
                    parse_mode: 'Markdown'
                  });

                  const tReq = https.request(telegramUrl, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Content-Length': Buffer.byteLength(postData)
                    }
                  });
                  
                  tReq.on('response', (tRes) => {
                    console.log('Estado de envío a Telegram:', tRes.statusCode);
                  });

                  tReq.write(postData);
                  tReq.end();
                  console.log(\`✅ Enviando notificación de prueba para: \${item.nombre}\`);
                } else {
                  console.log('No se encontraron registros en Supabase para enviar.');
                }
              } catch (e) {
                console.error('Error parseando respuesta:', e);
              }
            });
          });
          req.end();
          "
